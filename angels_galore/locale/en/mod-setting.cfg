vgal-override-vanilla-crafting-speeds=Override vanilla crafting speeds
vgal-remove-steel-intermediate-crafting=Remove steel to iron intermediate recipes
vgal-addonbots-buff-bots=Impove early bots
vgal-inventory-size-percentage=Inventory size (%)

[mod-setting-description]
vgal-override-vanilla-crafting-speeds=When enabled, overrides the assembler and furnace crafting speeds so each assembler tier increases speed by 0.5.
vgal-remove-steel-intermediate-crafting=When enabled, removes the steel to iron gear wheel and steel to iron stick recipes.
vgal-addonbots-buff-bots=When enabled, upgrades early bots to match the strength of vanilla bots, while also buffing the vanilla bots themselves to preserve progression.
