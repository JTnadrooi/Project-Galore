[mod-setting-name]
vgal-log=Enable logging
vgal-on-error=On error behavior
vgal-show-prod-descs=Show productivity info descriptions
vgal-auto-research-tech-nodes=Automatically research available tech nodes

[mod-setting-description]
vgal-log=Activates the vgal.log() function for logging mod activities. (Prototype phase only)
vgal-show-prod-descs=Overrides recipe descriptions to show productivity info instead.
# vgal-on-error=Dictates on-error behavior.

[string-mod-setting]
vgal-on-error-continue=Continue
vgal-on-error-stop=Stop

[string-mod-setting-description]
vgal-on-error-continue=Attempts to continue the startup process even when something goes wrong. Errors will be logged.
vgal-on-error-stop=Crashes during startup as soon as anything unexpected happens.